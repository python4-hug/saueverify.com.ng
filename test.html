<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
  <style>
    body{
  font-family: Arial;
  margin:0;
  background:#f4f6f9;
}

.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.login-box{
  background:white;
  padding:30px;
  border-radius:10px;
  width:300px;
  box-shadow:0 0 10px rgba(0,0,0,.2);
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
}

button{
  width:100%;
  padding:10px;
  background:#007bff;
  color:white;
  border:none;
}

nav{
  background:#002b5c;
  color:white;
  display:flex;
  justify-content:space-between;
  padding:15px;
}

nav ul{
  list-style:none;
  display:flex;
  gap:20px;
}

.profile-container{
  padding:30px;
  display:flex;
  gap:40px;
}

.passport-box img{
  width:150px;
  height:150px;
  border-radius:10px;
  object-fit:cover;
}
  </style>
</head>

<body class="center">

<div class="login-box">
  <h2>Student Portal Login</h2>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <p id="msg"></p>
</div>

<script>
  // =======================
// STUDENT DATABASE (Fake)
// =======================

const students = [
{
 username:"john",
 password:"1234",
 fullname:"John Musa",
 matric:"U2023/001",
 programme:"BSc Computer Science",
 faculty:"Science",
 department:"Computer Science",
 session:"2023/2024",
 semester:"First Semester",
 clearance:"Cleared",
 dob:"12-05-2003",
 certificate:"CERT-001",
 admission:"10-10-2023",
 graduation:"10-10-2027",
 gender:"Male",
 nationality:"Nigerian"
},

{
 username:"amina",
 password:"abcd",
 fullname:"Amina Bello",
 matric:"U2022/045",
 programme:"BSc Accounting",
 faculty:"Management Science",
 department:"Accounting",
 session:"2022/2023",
 semester:"Second Semester",
 clearance:"Pending",
 dob:"02-11-2002",
 certificate:"CERT-002",
 admission:"11-10-2022",
 graduation:"11-10-2026",
 gender:"Female",
 nationality:"Nigerian"
}
];


// =======================
// LOGIN FUNCTION
// =======================

function login(){

 let user=document.getElementById("username").value;
 let pass=document.getElementById("password").value;

 let student = students.find(
   s => s.username===user && s.password===pass
 );

 if(student){
   localStorage.setItem("loggedStudent", JSON.stringify(student));
   window.location="profile.html";
 }else{
   document.getElementById("msg").innerText="Invalid login!";
 }
}


// =======================
// LOAD PROFILE
// =======================

if(window.location.pathname.includes("profile.html")){

 let student = JSON.parse(localStorage.getItem("loggedStudent"));

 if(!student){
   window.location="index.html";
 }

 const container=document.getElementById("studentData");

 container.innerHTML=`
   <h2>${student.fullname}</h2>
   <p><b>Matric Number:</b> ${student.matric}</p>
   <p><b>Programme:</b> ${student.programme}</p>
   <p><b>Faculty:</b> ${student.faculty}</p>
   <p><b>Department:</b> ${student.department}</p>
   <p><b>Session:</b> ${student.session}</p>
   <p><b>Completed Semester:</b> ${student.semester}</p>
   <p><b>Clearance Status:</b> ${student.clearance}</p>
   <p><b>DOB:</b> ${student.dob}</p>
   <p><b>Certificate Number:</b> ${student.certificate}</p>
   <p><b>Date of Admission:</b> ${student.admission}</p>
   <p><b>Date of Graduation:</b> ${student.graduation}</p>
   <p><b>Gender:</b> ${student.gender}</p>
   <p><b>Nationality:</b> ${student.nationality}</p>
 `;


// =======================
// PASSPORT EDIT
// =======================

document.getElementById("upload")
.addEventListener("change", function(e){

 const file=e.target.files[0];
 const reader=new FileReader();

 reader.onload=function(){
   document.getElementById("passport").src=reader.result;
   localStorage.setItem("passport",reader.result);
 }

 reader.readAsDataURL(file);
});


// Load saved passport
let savedPassport=localStorage.getItem("passport");
if(savedPassport){
 document.getElementById("passport").src=savedPassport;
}

}


// =======================
// LOGOUT
// =======================

function logout(){
 localStorage.removeItem("loggedStudent");
 window.location="index.html";
}
</script>
</body>
</html>
